services:
  postgres:
    image: postgres:15
    container_name: pacs-postgres
    environment:
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs_secret
      POSTGRES_DB: pacs_rayos_x
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  orthanc:
    image: jodogne/orthanc:latest
    container_name: pacs-orthanc
    ports:
      - "4242:4242"
      - "8042:8042"
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    restart: unless-stopped

volumes:
  pgdata:
  orthanc_data:
