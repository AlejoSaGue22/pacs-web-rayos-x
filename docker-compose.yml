services:
  postgres:
    image: postgres:15
    container_name: pacs-postgres
    environment:
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs_secret
      POSTGRES_DB: pacs_rayos_x
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  orthanc:
    image: jodogne/orthanc-plugins:latest
    container_name: pacs-orthanc
    ports:
      - "4242:4242"
      - "8042:8042"
    volumes:
      - orthanc_data:/var/lib/orthanc/db
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc-webhook.lua:/etc/orthanc/orthanc-webhook.lua:ro
    environment:
      - BACKEND_WEBHOOK_URL=http://app:3000/api/orthanc/webhook
      - BACKEND_WEBHOOK_SECRET=pacs-webhook-secret-2026
    command: ["/etc/orthanc/orthanc.json"]
    restart: unless-stopped

  ohif:
    build:
      context: ./docker/ohif
      dockerfile: Dockerfile
    container_name: pacs-ohif
    ports:
      - "80:80"
    restart: unless-stopped

